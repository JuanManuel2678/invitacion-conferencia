<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120">
  <defs>
    <!-- Gradiente de fondo del isotipo -->
    <linearGradient id="gradienteSol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Gradiente de las colinas / comunidad -->
    <linearGradient id="gradienteColina" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- ================= ISOTIPO / SÍMBOLO ================= -->
  <g transform="translate(15, 10)">
    <!-- Círculo contenedor / Sol de fondo -->
    <circle cx="50" cy="50" r="46" fill="url(#gradienteSol)" opacity="0.12" />
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#gradienteSol)" stroke-width="2.5" />

    <!-- Silueta de colinas (Altos Mirandinos) -->
    <path d="M 12 76 Q 30 45, 52 64 T 88 76 Z" fill="url(#gradienteColina)" opacity="0.85" />
    
    <!-- Silueta urbana / Barrio (casas y comunidad) -->
    <rect x="32" y="52" width="10" height="26" rx="2" fill="#1e293b" />
    <rect x="45" y="42" width="12" height="36" rx="2" fill="#2563eb" />
    <polygon points="45,42 51,34 57,42" fill="#38bdf8" />
    <rect x="60" y="56" width="9" height="22" rx="2" fill="#0f172a" />

    <!-- Ventanas minimalistas (luz/comunidad) -->
    <circle cx="37" cy="58" r="1.5" fill="#ffffff" />
    <circle cx="51" cy="48" r="1.5" fill="#ffffff" />
    <circle cx="51" cy="56" r="1.5" fill="#ffffff" />
    <circle cx="64.5" cy="62" r="1.5" fill="#ffffff" />

    <!-- Arco de encuentro / Onda de voz / Conferencia -->
    <path d="M 28 32 C 40 22, 60 22, 72 32" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ================= LOGOTIPO / TEXTO ================= -->
  <!-- CONFERENCIA DEL BARRIO -->
  <text x="135" y="52" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#0f172a">
    CONFERENCIA
  </text>
  <text x="332" y="52" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="24" 
        font-weight="400" 
        letter-spacing="1.5" 
        fill="#2563eb">
    DEL BARRIO
  </text>

  <!-- SUBTÍTULO: LOS TEQUES -->
  <text x="136" y="80" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#059669">
    LOS TEQUES
  </text>

  <!-- Línea decorativa sutil -->
  <line x1="285" y1="75" x2="440" y2="75" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
</svg>
